version: '3.8'

services:
  urbanpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanpulse_ai_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8000","http://127.0.0.1:8000"]
    volumes:
      - urbanpulse_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  urbanpulse_data:
    driver: local
